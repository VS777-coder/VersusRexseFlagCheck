<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Versus Revise - Forward Lookup</title>
    <style>
        :root { --c-bg: #111; --c-text: #eee; --c-accent: #ffd700; --c-active-border: #adff2f; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--c-bg); color: var(--c-text); font-family: monospace; overflow: hidden; display: flex; flex-direction: column; }
        
        .header { padding: 8px; background: #222; border-bottom: 1px solid #444; flex-shrink: 0; }
        .tab-group { display: flex; gap: 4px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 2px; }
        .tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 4px; border: 2px solid #444; opacity: 0.6; min-width: 85px; filter: brightness(0.6); }
        .tab.active { opacity: 1; filter: brightness(1); border-color: var(--c-active-border); }
        
        #s-hazure { background: #ffffff; color: #333; }
        #s-don { background: #304ffe; color: #fff; }
        #s-seven { background: #d50000; color: #fff; }
        #s-reg { background: #333; color: #fff; border: 2px solid #666; }

        .flag-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 5px; }
        .flag-btn { padding: 8px 2px; font-size: 10px; text-align: center; background: #333; border: 1px solid #555; border-radius: 2px; cursor: pointer; color: #ccc; }
        .flag-btn.active { background: #555; color: #fff; border-color: var(--c-accent); }

        .main-content { flex: 1; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 10px; }
        .reel-table-container { background: #1a1a1a; border-radius: 4px; border: 1px solid #333; }
        .reel-title { padding: 5px; font-size: 12px; font-weight: bold; background: #222; border-bottom: 1px solid #333; color: var(--c-accent); text-align: center; }
        
        table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
        th { background: #222; position: sticky; top: 0; z-index: 2; border-bottom: 1px solid #444; padding: 5px 0; }
        td { border-bottom: 1px solid #222; padding: 6px 2px; text-align: center; height: 40px; }
        
        /* ターゲット行のハイライト */
        .highlight-row { background: rgba(173, 255, 47, 0.15) !important; }
        .highlight-row td { border-top: 1px solid var(--c-active-border); border-bottom: 1px solid var(--c-active-border); }

        .pos-idx { color: var(--c-accent); font-weight: bold; }
        .slip-val { font-size: 16px; font-weight: bold; color: #fff; }
        .symbol-name { font-size: 10px; color: #aaa; }
        .stop-symbol { background: #262626; color: #ffd700; font-weight: bold; border: 1px solid #444; border-radius: 2px; padding: 2px 0; }

        .footer { padding: 8px; background: #222; border-top: 1px solid #444; display: flex; gap: 5px; }
        .back-btn { flex: 1; padding: 12px; background: #d50000; color: #fff; text-decoration: none; text-align: center; border-radius: 4px; font-weight: bold; font-size: 14px; border: 1px solid #800000; }
    </style>
</head>
<body>
    <div class="header">
        <div class="tab-group">
            <div id="s-hazure" class="state-tab tab active" onclick="lookup.setState('hazure')">ボーナス未成立</div>
            <div id="s-don" class="state-tab tab" onclick="lookup.setState('don')">Xビッグ成立</div>
            <div id="s-seven" class="state-tab tab" onclick="lookup.setState('seven')">７ビッグ成立</div>
            <div id="s-reg" class="state-tab tab" onclick="lookup.setState('reg')">REG成立</div>
        </div>
        <div id="flag-list" class="flag-selector"></div>
    </div>

    <div class="main-content" id="scroll-area">
        <div class="reel-table-container" id="section-left">
            <div class="reel-title">左リール 解析</div>
            <table id="table-left">
                <thead><tr><th width="15%">Pos</th><th width="15%">滑り</th><th width="35%">押下時</th><th width="35%">停止形</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="reel-table-container" id="section-middle">
            <div class="reel-title">中リール 解析</div>
            <table id="table-middle">
                <thead><tr><th width="15%">Pos</th><th width="15%">滑り</th><th width="35%">押下時</th><th width="35%">停止形</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="reel-table-container" id="section-right">
            <div class="reel-title">右リール 解析</div>
            <table id="table-right">
                <thead><tr><th width="15%">Pos</th><th width="15%">滑り</th><th width="35%">押下時</th><th width="35%">停止形</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        <a href="index.html" class="back-btn">シミュレーターに戻る</a>
    </div>

const lookup = {
    state: { flagMode: 'hazure', selectedFlagIdx: 0, targetReel: 'left', targetPos: 21 },
    
    init() {
        // URLパラメータを取得して初期状態をセット
        const urlParams = new URLSearchParams(window.location.search);
        this.state.targetReel = urlParams.get('reel') || 'left';
        this.state.flagMode = urlParams.get('mode') || 'hazure';
        this.state.targetPos = parseInt(urlParams.get('pos')) || 21;

        this.renderFlags();
        this.setState(this.state.flagMode);
        
        // ターゲットリールのセクションまでスクロール
        setTimeout(() => {
            const targetEl = document.getElementById(`section-${this.state.targetReel}`);
            if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth' });
        }, 300);
    },

    renderFlags() {
        const container = document.getElementById('flag-list');
        container.innerHTML = '';
        FLAG_INFO.forEach((f, i) => {
            const btn = document.createElement('div');
            btn.className = `flag-btn ${i === this.state.selectedFlagIdx ? 'active' : ''}`;
            btn.innerText = f.n;
            btn.onclick = () => {
                this.state.selectedFlagIdx = i;
                document.querySelectorAll('.flag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.update();
            };
            container.appendChild(btn);
        });
    },

    setState(s) {
        this.state.flagMode = s;
        document.querySelectorAll('.state-tab').forEach(el => el.classList.toggle('active', el.id === `s-${s}`));
        this.update();
    },

    update() {
        const stateMap = { 'hazure':'hazure', 'don':'Vsus', 'seven':'seven', 'reg':'reg' };
        const mode = stateMap[this.state.flagMode];
        
        ['left', 'middle', 'right'].forEach(reel => {
            const tbody = document.querySelector(`#table-${reel} tbody`);
            tbody.innerHTML = '';
            const master = SLIP_MASTERS[reel][mode];
            const symbols = REEL_SYMBOLS[reel];

            for (let pos = 21; pos >= 1; pos--) {
                const tr = document.createElement('tr');
                
                // 指定された停止位置ならハイライト
                if (reel === this.state.targetReel && pos === this.state.targetPos) {
                    tr.className = 'highlight-row';
                }

                const rowData = master ? master[pos] : null;
                let slip = "-";
                if (rowData) {
                    for(let s=0; s<5; s++) {
                        const val = rowData[this.state.selectedFlagIdx * 5 + s];
                        if (val !== undefined && val !== null && val !== "") { slip = val; break; }
                    }
                }

                const pushSym = symbols[21 - pos];
                let stopPos = pos - (slip === "-" ? 0 : parseInt(slip));
                while (stopPos < 1) stopPos += 21;
                const stopSym = symbols[21 - stopPos];

                tr.innerHTML = `
                    <td class="pos-idx">${pos}</td>
                    <td class="slip-val">${slip}</td>
                    <td class="symbol-name">${pushSym}</td>
                    <td><div class="stop-symbol">${stopSym}</div><span style="font-size:9px">at ${stopPos}</span></td>
                `;
                tbody.appendChild(tr);
            }
        });
    }
};

window.onload = () => lookup.init();
